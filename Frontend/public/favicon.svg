<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A862"/>
      <stop offset="60%" stop-color="#D69A55"/>
      <stop offset="100%" stop-color="#BD7A36"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1A0F08" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Warm Caramel/Gold Base with rounded corners -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="110" fill="none" stroke="#F5D89A" stroke-width="5" stroke-opacity="0.7"/>

  <!-- Notebook Group -->
  <g filter="url(#cardShadow)">
    <!-- Pages edge (cream/beige) -->
    <rect x="146" y="105" width="244" height="320" rx="22" fill="#EADC CB" stroke="#D1BFA8" stroke-width="2"/>
    
    <!-- Notebook cover (deep espresso brown #24160F) -->
    <rect x="130" y="95" width="244" height="322" rx="20" fill="#24160F" stroke="#1A0F08" stroke-width="4"/>
    
    <!-- Spine binding section on left -->
    <rect x="130" y="95" width="44" height="322" rx="18" fill="#1A0F08"/>
    <line x1="174" y1="95" x2="174" y2="417" stroke="#4A2F1F" stroke-width="3"/>

    <!-- Gold bookmark ribbon hanging down -->
    <path d="M 250 95 L 250 235 L 266 215 L 282 235 L 282 95 Z" fill="#D69A55"/>

    <!-- Elastic band strap on right side -->
    <rect x="348" y="95" width="18" height="322" rx="4" fill="#D69A55" opacity="0.88"/>

    <!-- Gold embossed notebook detail lines -->
    <rect x="195" y="270" width="130" height="12" rx="6" fill="#D69A55" opacity="0.9"/>
    <rect x="195" y="300" width="100" height="10" rx="5" fill="#E8D2B5" opacity="0.7"/>
    <rect x="195" y="322" width="120" height="10" rx="5" fill="#E8D2B5" opacity="0.7"/>
  </g>
</svg>
