name: MindDesk Production CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint, Security & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm ci

      - name: Run Backend Syntax and Module Validation
        working-directory: ./Backend
        run: node -c server.js

  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Validate Production Build
        working-directory: ./Frontend
        env:
          VITE_API_URL: https://minddesk-api.example.com
        run: npm run build
